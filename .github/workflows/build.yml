name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup vcpkg
      run: |
        vcpkg integrate install

    - name: Install dependencies
      run: |
        vcpkg install gtk:x64-windows libzip:x64-windows libxml2:x64-windows

    - name: Build
      run: |
        msbuild LivretCompetences.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Livret-Numerique-Competences-Windows-Build
        path: x64/Release/LivretCompetences.exe
