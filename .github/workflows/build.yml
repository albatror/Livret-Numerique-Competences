name: Build Windows Executable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libzip-dev libxml2-dev build-essential pkg-config

    - name: Build
      run: |
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Livret-Numerique-Competences-C-Build
        path: LivretCompetences
